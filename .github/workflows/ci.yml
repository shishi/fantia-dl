name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-
          gc-max-store-size-linux: 4G

      - name: Build devShell dependencies
        run: nix build .#devShells.x86_64-linux.default.inputDerivation --no-link

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('bun.lock') }}

      - name: Install
        run: nix develop -c bun install --frozen-lockfile

      - name: Typecheck
        run: nix develop -c bunx tsc --noEmit

      - name: Test
        run: nix develop -c bunx vitest run

      - name: Build
        run: nix develop -c bun scripts/build.mjs

      - name: Verify dist artifacts
        run: |
          for f in \
            dist/manifest.json \
            dist/background/service-worker.js \
            dist/content/content-script.js \
            dist/content/page-script.js \
            dist/options/options.js \
            dist/options/options.html \
          ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
